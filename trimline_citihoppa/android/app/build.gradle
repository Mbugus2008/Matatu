plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println('key.properties file not found')
}
def hasKeystoreProperties = keystorePropertiesFile.exists()
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "trimline.citihoppa"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "trimline.citihoppa"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // Flutter's own default is 29 (Android 10); the fleet still has phones
        // on Android 9 (Pie) and nothing here needs API 29 features.
        minSdkVersion 28
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

  
     signingConfigs {
        release {
            if (hasKeystoreProperties) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    } 
     buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig hasKeystoreProperties ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // Debug builds share the release upload key so they can be
            // installed over / updated by the production app on the same
            // device (and vice versa). Without this, MIUI rejects every
            // cross-install with "App not installed as package conflicts
            // with an existing package".
            signingConfig hasKeystoreProperties ? signingConfigs.release : signingConfigs.debug
        }
        profile {
            // Same as debug: profile builds also run on the fleet devices.
            signingConfig hasKeystoreProperties ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Debug/profile APKs get the same version code family as the production
// arm64 APK (2 * 1000 + build, e.g. 2038) that the fleet devices run.
// Release family codes come from the Flutter plugin's ABI-split logic;
// without this, a plain debug build (versionCode 38) cannot replace the
// installed production app (2038) and `flutter run` dies with
// INSTALL_FAILED_VERSION_DOWNGRADE. The next feed release (2039) still
// upgrades over it, so devices are never stranded.
// Only non-split outputs are touched — split builds keep their per-ABI codes.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'debug' || variant.buildType.name == 'profile') {
        variant.outputs.each { output ->
            if (output.getFilter(com.android.build.VariantOutput.FilterType.ABI) == null) {
                output.versionCodeOverride = 2000 + variant.versionCode
            }
        }
    }
}

flutter {
    source '../..'
}


